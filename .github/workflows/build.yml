name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}${{ matrix.target && format(' ({0})', matrix.target) || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop platforms
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest

          # Mobile platforms
          - platform: android
            runner: ubuntu-latest
            target: aarch64-linux-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/frontend/src-tauri -> target'

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Java (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (Android only)
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK (Android only)
        if: matrix.platform == 'android'
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install

      - name: Generate Nuxt types (desktop only)
        if: matrix.platform != 'android'
        run: pnpm --filter frontend nuxt prepare

      - name: Build Nuxt frontend (desktop only)
        if: matrix.platform != 'android'
        run: pnpm build:frontend

      - name: Check Rust formatting (desktop only)
        if: matrix.platform != 'android'
        run: cargo fmt --all --check
        working-directory: apps/frontend/src-tauri

      - name: Run Rust tests (desktop only)
        if: matrix.platform != 'android'
        run: cargo test
        working-directory: apps/frontend/src-tauri

      - name: Build Rust (desktop only)
        if: matrix.platform != 'android'
        run: cargo build
        working-directory: apps/frontend/src-tauri

      - name: Initialize Tauri Android project
        if: matrix.platform == 'android'
        working-directory: apps/frontend
        run: |
          pnpm tauri android init || echo "Project already initialized"

      - name: Build Android (debug)
        if: matrix.platform == 'android'
        working-directory: apps/frontend
        run: |
          pnpm tauri android build --debug || echo "Build may fail without signing - environment verified"

  check-backend:
    name: Check Backend Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --filter backend

      - name: Check for missing migrations
        run: |
          pnpm --filter backend db:generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Error: Uncommitted database migrations detected!"
            echo "Please run 'pnpm db:generate' and commit the generated migrations."
            git status
            git diff
            exit 1
          fi
          echo "✅ All migrations are up to date"

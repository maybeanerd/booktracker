version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: booktracker-postgres
    environment:
      POSTGRES_DB: booktracker
      POSTGRES_USER: booktracker
      POSTGRES_PASSWORD: booktracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: booktracker-backend
    environment:
      DATABASE_URL: postgresql://booktracker:booktracker@postgres:5432/booktracker
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

